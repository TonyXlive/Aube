name: Publier Aube

# À chaque nouvelle édition : enregistre l'émission avec Gemini TTS (dialogue natif à deux voix,
# offre gratuite : 10 requêtes/jour/modèle, un épisode en consomme environ 5).
# Si Gemini échoue, la version de secours open source (Piper) générée la nuit reste en place,
# et une nouvelle tentative est faite à 6h30 (heure de Paris).
# GitHub Pages republie ensuite le site tout seul.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Outils audio
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Enregistrer l'émission avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "Aube bot"
          git config user.email "aube-bot@users.noreply.github.com"
          git pull -q --rebase origin main || true
          if [ -z "$GEMINI_API_KEY" ]; then echo "Pas de clé Gemini : version de secours conservée."; exit 0; fi
          LATEST=$(python3 -c "import json;print(json.load(open('editions/index.json'))['latest'])")
          F="editions/$LATEST.json"
          V=$(python3 -c "import json;print((json.load(open('$F')).get('podcast') or {}).get('voice',''))")
          if [ "$V" = "gemini" ]; then echo "Émission déjà enregistrée avec Gemini."; exit 0; fi
          if python3 tools/podcast.py "$F" --engine gemini; then
            ls -1 podcast/*.ogg 2>/dev/null | sort -r | tail -n +22 | xargs -r git rm -q
            MSG="Podcast (gemini) du $LATEST"
          else
            echo "::warning::Gemini indisponible : la version de secours reste en place."
            MSG="État podcast du $LATEST"
          fi
          git add -A
          if git commit -q -m "$MSG"; then
            for essai in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 10
            done
          fi

name: Publier Aube

# À chaque nouvelle édition : refait le podcast avec des voix neuronales naturelles
# (gratuites, via edge-tts). GitHub Pages republie ensuite le site tout seul.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Outils audio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q edge-tts
      - name: Podcast voix naturelles
        id: gen
        run: |
          git config user.name "Aube bot"
          git config user.email "aube-bot@users.noreply.github.com"
          git pull -q --rebase origin main || true
          LATEST=$(python3 -c "import json;print(json.load(open('editions/index.json'))['latest'])")
          F="editions/$LATEST.json"
          OK=$(python3 -c "
          import json
          d = json.load(open('$F')); v = (d.get('podcast') or {}).get('voice', '')
          print('oui' if v == 'neural2' or (v == 'neural' and not d.get('script')) else 'non')")
          if [ "$OK" = "oui" ]; then echo "Déjà en voix naturelles."; exit 0; fi
          if python3 tools/podcast.py "$F" --engine edge --rate=+0%; then
            ls -1 podcast/*.ogg 2>/dev/null | sort -r | tail -n +15 | xargs -r git rm -q
            git add -A
            if git commit -q -m "Podcast voix naturelles du $LATEST"; then
              for essai in 1 2 3; do
                git pull -q --rebase origin main && git push -q origin HEAD:main && break
                sleep 10
              done
            fi
          else
            echo "::warning::Voix naturelles indisponibles, le podcast reste en voix de secours."
          fi

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aube</title>
<meta name="description" content="Ton brief d'actualité du matin : monde, France, Lyon, tech, IA, bourse.">
<meta name="theme-color" content="#f3f1fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0c1b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aube">
<meta name="mobile-web-app-capable" content="yes">
<style>html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell (max 480px), sticky top bar + category rail, feed of cards, bottom tab bar, article bottom sheet */
:root{
  --bg:#f3f1fa; --surface:#ffffff; --surface-2:#ebe8f6; --ink:#16132b; --ink-2:#5b5776; --line:#dcd8ec;
  --dawn-a:#ff7a59; --dawn-b:#ffb547; --dawn-c:#7c5cff; --accent:#6a48f0; --accent-ink:#ffffff;
  --essentiel:#e5484d; --important:#e8890c; --savoir:#2f8f6b;
  --shadow:0 1px 2px rgba(22,19,43,.06),0 8px 24px rgba(22,19,43,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e0c1b; --surface:#191629; --surface-2:#231f38; --ink:#f1eefc; --ink-2:#a6a1c2; --line:#2e2947;
  --accent:#9b84ff; --accent-ink:#120f22; --essentiel:#ff6b6f; --important:#ffad3d; --savoir:#4fd1a1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0c1b; --surface:#191629; --surface-2:#231f38; --ink:#f1eefc; --ink-2:#a6a1c2; --line:#2e2947;
  --accent:#9b84ff; --accent-ink:#120f22; --essentiel:#ff6b6f; --important:#ffad3d; --savoir:#4fd1a1;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));position:relative}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px 10px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.sun{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 200deg,var(--dawn-c),var(--dawn-a),var(--dawn-b),var(--dawn-c));display:grid;place-items:center;flex:none}
.sun i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
.brand b{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand small{display:block;font-size:11.5px;color:var(--ink-2);font-weight:500;margin-top:-2px}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:18px;height:18px}
.hbtns{display:flex;gap:8px}
.iconbtn.spin svg{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.offline{font-size:11.5px;font-weight:600;color:var(--important);margin-top:6px}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:0 12px;height:42px;box-shadow:var(--shadow)}
.search svg{width:16px;height:16px;color:var(--ink-2);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font:inherit;color:var(--ink);height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin:0 -16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:13.5px;color:var(--ink-2);box-shadow:var(--shadow);white-space:nowrap;transition:background .2s,color .2s}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

main{padding:6px 16px 0;display:flex;flex-direction:column;gap:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sec-h span{font-size:12.5px;color:var(--ink-2);font-weight:500}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}

/* hero */
.hero{border-radius:24px;padding:20px 20px 18px;color:#fff;position:relative;overflow:hidden;background:
  radial-gradient(120% 90% at 100% 0%,rgba(255,181,71,.95),transparent 55%),
  radial-gradient(110% 80% at 0% 100%,rgba(124,92,255,.95),transparent 60%),
  linear-gradient(160deg,#ff7a59,#c2457a 55%,#4b2fd0)}
.hero .eyebrow{color:rgba(255,255,255,.82)}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(23px,6.4vw,28px);line-height:1.06;letter-spacing:-.03em;margin:6px 0 4px;text-wrap:balance}
.hero p.sub{margin:0 0 12px;color:rgba(255,255,255,.88);font-size:13px}
.thirty{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.13);border-radius:14px;padding:4px 0}
.thirty li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:13.5px;line-height:1.4;padding:7px 12px}
.thirty li+li{border-top:1px solid rgba(255,255,255,.14)}
.thirty li b{font-family:var(--f-mono);font-size:12px;opacity:.85;padding-top:1px}
.hero .meta{margin-top:12px;font-size:11.5px;color:rgba(255,255,255,.78);display:flex;gap:6px;align-items:center}

/* countdown */
.cd{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.cd::-webkit-scrollbar{display:none}
.cdc{flex:none;width:158px;scroll-snap-align:start;background:var(--surface);border-radius:var(--r);padding:12px 13px 13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;text-align:left}
.cdc .days{font-family:var(--f-mono);font-weight:700;font-size:26px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cdc .days small{font-size:11px;font-weight:500;color:var(--ink-2);margin-left:3px}
.cdc.today .days{color:var(--essentiel)}
.cdc.soon .days{color:var(--important)}
.cdc .t{font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cdc .d{font-size:11.5px;color:var(--ink-2);margin-top:auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--ink-2))}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* cards */
.list{display:flex;flex-direction:column;gap:10px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);transition:transform .15s}
.card:active{transform:scale(.985)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.card h3{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.22;letter-spacing:-.015em;margin:0 0 5px;text-wrap:balance}
.card p{margin:0;color:var(--ink-2);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.src{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--surface-2);font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--ink)}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.pill.une{background:color-mix(in srgb,var(--essentiel) 15%,transparent);color:var(--essentiel)}
.pill.important{background:color-mix(in srgb,var(--important) 16%,transparent);color:var(--important)}
.pill.savoir{background:color-mix(in srgb,var(--savoir) 15%,transparent);color:var(--savoir)}
.card.big{padding:16px 16px 15px;border-left:0;position:relative;overflow:hidden}
.card.big h3{font-size:19.5px}
.card.big p{-webkit-line-clamp:3}
.bm{margin-left:auto;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.bm svg{width:17px;height:17px}
.bm[aria-pressed="true"]{color:var(--accent)}
.bm[aria-pressed="true"] svg path{fill:currentColor}

.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px;line-height:1.45}
.disclaim{font-size:12px;color:var(--important);font-weight:600;margin:-4px 0 8px}

/* empty / loading */
.empty{background:var(--surface);border-radius:var(--r);padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.empty h3{font-family:var(--f-display);font-size:19px;margin:10px 0 6px}
.empty p{margin:0;color:var(--ink-2);font-size:14px}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:22px;box-shadow:0 10px 34px rgba(22,19,43,.18);padding:7px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:15px;font-size:11px;font-weight:600;color:var(--ink-2);position:relative}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.tab .badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--essentiel);color:#fff;font-size:10px;font-family:var(--f-mono);display:grid;place-items:center;padding:0 4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,22,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.12;letter-spacing:-.025em;margin:10px 0 10px;text-wrap:balance}
.sheet .body{font-size:16px;line-height:1.6;color:var(--ink);margin:0 0 14px}
.sheet .kv{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;font-size:15px;margin-top:16px}
.cta svg{width:16px;height:16px}
.sheet .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ghost{height:44px;border-radius:13px;background:var(--surface-2);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.ghost svg{width:16px;height:16px}
.url{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);word-break:break-all;margin-top:10px}

.archive{display:flex;gap:8px;flex-wrap:wrap}
.archive button{height:32px;padding:0 12px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.archive button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* lu / non lu */
.card.read h3{opacity:.55}.card.read p{opacity:.7}
.readmark{display:none;font-size:11px;font-weight:700;color:var(--savoir);align-items:center;gap:3px}
.card.read .readmark{display:inline-flex}
/* hero extras */
.herorow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.flashbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px 0 12px;border-radius:999px;background:#fff;color:#2a1660;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(40,10,90,.25)}
.flashbtn svg{width:16px;height:16px}
.prog{flex:1;min-width:120px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:rgba(255,255,255,.85)}
.prog .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.prog .bar i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .4s}
.wx{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 12px;margin:0 0 12px;font-size:13px}
.wx b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.wx .ico{font-size:24px;line-height:1}
.wx .more{color:rgba(255,255,255,.85);font-size:12px;line-height:1.35;min-width:0}
/* flash (stories) */
.flash{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;color:#fff;background:#120d2a;padding:calc(12px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px));transition:background .35s;user-select:none;-webkit-user-select:none}
.flash .bars{display:flex;gap:4px}
.flash .bars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
.flash .bars span i{display:block;height:100%;width:0;background:#fff}
.flash .bars span.done i{width:100%}
.flash .fhead{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8)}
.flash .fclose{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.flash .fclose svg{width:18px;height:18px}
.flash .fbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:520px;width:100%;margin:0 auto}
.flash .fcat{display:inline-flex;align-self:flex-start;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.18);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.flash h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.05;letter-spacing:-.03em;margin:0;text-wrap:balance}
.flash p{font-size:17px;line-height:1.55;margin:0;color:rgba(255,255,255,.92)}
.flash .fsrc{font-size:13px;color:rgba(255,255,255,.75)}
.flash .fcta{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:15px;background:#fff;color:#1d1440;font-weight:700;text-decoration:none;max-width:520px;width:100%;margin:0 auto;position:relative;z-index:2}
.flash .tapzone{position:absolute;top:90px;bottom:90px;width:38%;z-index:1}
.flash .tapzone.l{left:0}.flash .tapzone.r{right:0;width:62%}
.flash .fhint{text-align:center;font-size:11.5px;color:rgba(255,255,255,.6);margin-top:10px}
/* réglages */
.set h3{font-family:var(--f-display);font-size:16px;margin:18px 0 8px}
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--ink-2)}
.tog .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:4px;border-radius:13px}
.seg button{height:38px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cityrow{display:flex;gap:8px}
.cityrow input{flex:1;min-width:0;height:44px;border-radius:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.cityrow button{height:44px;padding:0 16px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.sethint{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.icsbtn{margin-left:auto;font-weight:600;color:var(--accent);font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.icsbtn svg{width:14px;height:14px}
/* tirer pour actualiser */
.ptr{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));z-index:25;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--accent);transform:translateY(-70px);transition:transform .2s}
.ptr svg{width:18px;height:18px}
.ptr.go svg{animation:spin .8s linear infinite}
main{zoom:var(--z,1)}.sheet>*:not(.grab):not(.sclose){zoom:var(--z,1)}
.sclose{position:sticky;top:0;float:right;margin:-4px -6px 0 0;width:34px;height:34px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);z-index:2}
.sclose svg{width:16px;height:16px}
/* ---------- podcast ---------- */
.listenbtn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 12px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:14px;border:1px solid rgba(255,255,255,.35)}
.listenbtn svg{width:17px;height:17px}
.herobtns{display:flex;gap:8px;flex-wrap:wrap}
.player{border-radius:24px;padding:20px;color:#fff;background:radial-gradient(110% 80% at 100% 0%,rgba(255,181,71,.9),transparent 55%),radial-gradient(110% 90% at 0% 100%,rgba(124,92,255,.95),transparent 60%),linear-gradient(160deg,#ff7a59,#b23c7c 55%,#3a24b0);display:flex;flex-direction:column;gap:14px}
.player .eyebrow{color:rgba(255,255,255,.82)}
.player h2{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em;margin:0;line-height:1.08}
.player .now{font-size:14px;color:rgba(255,255,255,.9);min-height:20px}
.scrub{width:100%;accent-color:#fff;height:22px;margin:0}
.ptimes{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:rgba(255,255,255,.85);margin-top:-8px;font-variant-numeric:tabular-nums}
.pctl{display:flex;align-items:center;justify-content:center;gap:18px}
.pctl button{color:#fff;display:grid;place-items:center}
.pctl .sm{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.16);font-family:var(--f-mono);font-size:11px;font-weight:700;position:relative}
.pctl .sm svg{width:22px;height:22px}
.pctl .big{width:72px;height:72px;border-radius:50%;background:#fff;color:#3a24b0;box-shadow:0 10px 26px rgba(30,10,80,.35)}
.pctl .big svg{width:30px;height:30px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pchip{height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pchip svg{width:14px;height:14px}
.chaps{display:flex;flex-direction:column;gap:6px}
.chap{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border-radius:14px;padding:11px 13px;box-shadow:var(--shadow)}
.chap .ts{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chap b{font-weight:600;font-size:14.5px}
.chap.on{outline:2px solid var(--accent)}
.chap.on .ts{color:var(--accent)}
.chap .eq{display:none;gap:2px;align-items:flex-end;height:14px}
.chap.on .eq{display:flex}
.chap .eq i{width:3px;background:var(--accent);border-radius:2px;animation:eq 1s ease-in-out infinite}
.chap .eq i:nth-child(2){animation-delay:.2s}.chap .eq i:nth-child(3){animation-delay:.4s}
.paused .chap .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:4px}50%{height:14px}}
.mini{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:29;padding:0 12px}
.mini>div{max-width:456px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.mini .mt{flex:1;min-width:0;font-size:13px;line-height:1.25}
.mini .mt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mt span{font-size:11.5px;opacity:.7}
.mini button.mp{width:40px;height:40px;border-radius:12px;background:var(--bg);color:var(--ink);display:grid;place-items:center;flex:none}
.mini button.mp svg{width:18px;height:18px}
.mini .mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.app.withmini{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.offl{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.offl .ok{color:var(--savoir);font-weight:700}
.tabs nav{grid-template-columns:repeat(5,1fr)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="toprow">
      <div class="brand"><div class="sun"><i></i></div><div><b>Aube</b><small id="dateLabel">Ton brief du matin</small><div class="offline" id="offline" hidden>Hors connexion · édition en cache</div></div></div>
      <div class="hbtns"><button class="iconbtn" id="installBtn" aria-label="Installer l'appli" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button><button class="iconbtn" id="refreshBtn" aria-label="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></button><button class="iconbtn" id="setBtn" aria-label="Réglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button><button class="iconbtn" id="themeBtn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
    </div>
    <label class="search" for="q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Chercher une news, une source…" autocomplete="off"></label>
    <div class="chips" id="chips" role="toolbar" aria-label="Catégories"></div>
  </header>
  <main id="main"></main>
</div>

<div class="tabs"><nav aria-label="Navigation">
  <button class="tab" data-view="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Brief</button>
  <button class="tab" data-view="listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="4" height="7" rx="2"/><rect x="17" y="14" width="4" height="7" rx="2"/></svg>Écouter</button>
  <button class="tab" data-view="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>Alertes<span class="badge" id="alertBadge" hidden></span></button>
  <button class="tab" data-view="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Favoris</button>
  <button class="tab" data-view="archive"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Éditions</button>
</nav></div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sTitle"></section>
<div class="toast" id="toast"></div>
<div class="mini" id="mini" hidden></div>
<audio id="au" preload="none"></audio>
<div class="flash" id="flash" hidden role="dialog" aria-label="Le Flash"></div>
<div class="ptr" id="ptr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></div>

<script>
const CATS=[
 {id:"all",label:"Tout",c:"var(--accent)"},
 {id:"une",label:"À la une",c:"#e5484d"},
 {id:"monde",label:"Monde",c:"#3b82f6"},
 {id:"france",label:"France",c:"#4f46e5"},
 {id:"local",label:"Lyon & Isère",c:"#d9467a"},
 {id:"eco",label:"Éco & conso",c:"#0f9d8a"},
 {id:"bourse",label:"Bourse",c:"#16a34a"},
 {id:"tech",label:"Tech",c:"#0ea5e9"},
 {id:"ia",label:"IA",c:"#8b5cf6"},
 {id:"nothing",label:"Nothing",c:"#a3a3a3"},
 {id:"jeux",label:"Jeux vidéo",c:"#f97316"},
 {id:"rh",label:"RH & paie",c:"#d97706"},
 {id:"sirh",label:"SIRH",c:"#0891b2"},
 {id:"sciences",label:"Sciences",c:"#14b8a6"},
 {id:"sport",label:"Sport",c:"#ef4444"},
 {id:"culture",label:"Culture",c:"#ec4899"}
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const IMP={une:"Essentiel",important:"Important",savoir:"À savoir"};
const S={editions:[],cur:null,cat:"all",view:"home",q:"",saved:{},loading:true,dbOk:true};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function ls(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
S.saved=ls("aube_saved",{})||{};S.read=ls("aube_read",{})||{};S.hidden=ls("aube_hidden",[])||[];
S.zoom=ls("aube_zoom",1)||1;S.city=ls("aube_city",{name:"Lyon",lat:45.7578,lon:4.832})||{name:"Lyon",lat:45.7578,lon:4.832};
document.documentElement.style.setProperty("--z",S.zoom);
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms||8)}catch(e){}}
function visCats(){return CATS.filter(c=>c.id==="all"||c.id==="une"||!S.hidden.includes(c.id))}
function markRead(k){if(S.read[k])return;S.read[k]=Date.now();const ks=Object.keys(S.read);if(ks.length>1500){ks.sort((a,b)=>S.read[a]-S.read[b]).slice(0,500).forEach(x=>delete S.read[x])}lsSet("aube_read",S.read)}
try{const t=localStorage.getItem("aube_theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
function persist(){lsSet("aube_saved",S.saved)}

function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysUntil(iso){const [y,m,d]=iso.split("-").map(Number);const t=new Date();const a=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((Date.UTC(y,m-1,d)-a)/864e5)}
function fmtDate(iso,opt){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("fr-FR",opt||{weekday:"long",day:"numeric",month:"long"})}
function initials(s){s=String(s||"?").replace(/^(Le|La|Les|L')\s*/i,"");return s.split(/[\s\-\/(]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return ""}}
function greet(){const h=new Date().getHours();return h<5?"Bonne nuit":h<12?"Bonjour":h<18?"Bon après-midi":"Bonsoir"}

function allArticles(){const e=S.cur;return e&&Array.isArray(e.articles)?e.articles:[]}
function articles(){return allArticles().filter(a=>a.cat==="une"||!S.hidden.includes(a.cat))}
function readMins(l){const w=l.reduce((n,a)=>n+((a.title||"")+" "+(a.summary||"")).split(/\s+/).length,0);return Math.max(1,Math.round(w/200))}
function visibleAlerts(){const e=S.cur;if(!e||!Array.isArray(e.alerts))return[];return e.alerts.map(a=>({...a,_d:daysUntil(a.date)})).filter(a=>a._d>=0).sort((a,b)=>a._d-b._d)}

function bmIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>'}
function card(a,big){const c=CAT[a.cat]||CAT.all;const k=keyOf(a);const sv=!!S.saved[k];
 const rd=!!S.read[k];
 return `<article><div class="card${big?" big":""}${rd?" read":""}" role="button" tabindex="0" data-open="${esc(k)}">
  <div class="row"><span class="tag" style="--c:${c.c}">${esc(c.label)}</span><span class="pill ${esc(a.importance)}">${esc(IMP[a.importance]||"")}</span></div>
  <h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p>
  <div class="foot"><span class="src">${esc(initials(a.source))}</span><span>${esc(a.source)}</span>${a.reliability?`<span>· ${esc(a.reliability)}</span>`:""}<span class="readmark">✓ Lu</span>
  <button class="bm" data-save="${esc(k)}" aria-pressed="${sv}" aria-label="${sv?"Retirer des favoris":"Ajouter aux favoris"}">${bmIcon()}</button></div>
 </div></article>`}
function keyOf(a){return (S.cur?S.cur.date:"")+"|"+(a.id||a.title)}

function renderChips(){const arts=articles();const counts={};arts.forEach(a=>counts[a.cat]=(counts[a.cat]||0)+1);
 $("#chips").innerHTML=visCats().filter(c=>c.id==="all"||counts[c.id]).map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${S.cat===c.id}" style="--c:${c.c}">${c.id!=="all"?'<span class="dot"></span>':""}${esc(c.label)}<span class="n">${c.id==="all"?arts.length:counts[c.id]}</span></button>`).join("")}

function cdCard(a){const d=a._d;const cls=d===0?"today":d<=7?"soon":"";const c=CAT[a.cat]||CAT.all;
 const big=d===0?"Auj.":d===1?"Demain":`J-${d}`;
 return `<button class="cdc ${cls}" data-alert="${esc(a.title)}"><span class="tag" style="--c:${c.c}">${esc(c.label)}</span><span class="days">${big}${d>1?"<small>jours</small>":""}</span><span class="t">${esc(a.title)}</span><span class="d">${esc(fmtDate(a.date,{weekday:"short",day:"numeric",month:"short"}))}</span></button>`}

function renderHome(){const e=S.cur;const arts=articles();let h="";
 const q=S.q.trim().toLowerCase();
 if(q){const r=arts.filter(a=>(a.title+" "+a.summary+" "+a.source).toLowerCase().includes(q));
  return `<section><div class="sec-h"><h2>Résultats</h2><span>${r.length} news</span></div><div class="list">${r.map(a=>card(a)).join("")||'<div class="note">Aucune news ne correspond. Essaie un autre mot.</div>'}</div></section>`}
 if(S.cat==="all"){
  h+=`<section class="hero"><div class="eyebrow">${esc(greet())} · ${esc(fmtDate(e.date))}</div>
   <h1>${esc(e.headline||"L'essentiel du jour")}</h1><p class="sub">${esc(e.tagline||"Le monde en 30 secondes")}</p>
   ${wxHTML()}
   <div class="herorow" style="margin:0 0 14px"><div class="herobtns">${e.podcast?`<button class="listenbtn" data-view="listen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="4" height="7" rx="2"/><rect x="17" y="14" width="4" height="7" rx="2"/></svg>Écouter · ${Math.round(e.podcast.duration/60)} min</button>`:""}<button class="flashbtn" id="flashBtn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Le Flash · ${flashList().length}</button></div>
   <div class="prog"><span>${nRead(arts)}/${arts.length} lues · ≈ ${readMins(arts)} min de lecture</span><div class="bar"><i style="width:${arts.length?Math.round(nRead(arts)/arts.length*100):0}%"></i></div></div>
   <ol class="thirty">${(e.thirty||[]).map((t,i)=>`<li><b>0${i+1}</b><span>${esc(t)}</span></li>`).join("")}</ol></div>
   <div class="meta">Édition générée ${e.generatedAt?esc(new Date(e.generatedAt).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})):""}</div></section>`;
  const al=visibleAlerts();
  if(al.length)h+=`<section><div class="sec-h"><h2>Compte à rebours</h2><span>${al.length} échéances</span></div><div class="cd">${al.slice(0,12).map(cdCard).join("")}</div></section>`;
  const une=arts.filter(a=>a.cat==="une");
  if(une.length)h+=`<section><div class="sec-h"><h2>À la une</h2><span>${une.length} sujets</span></div><div class="list">${une.map(a=>card(a,true)).join("")}</div></section>`;
  visCats().filter(c=>!["all","une"].includes(c.id)).forEach(c=>{const l=arts.filter(a=>a.cat===c.id);if(!l.length)return;
   h+=`<section><div class="sec-h"><h2>${esc(c.label)}</h2><button class="eyebrow" data-cat="${c.id}">Tout voir</button></div>${c.id==="bourse"?'<div class="disclaim">Infos de marché, pas un conseil en investissement.</div>':""}<div class="list">${l.slice(0,3).map(a=>card(a)).join("")}</div></section>`});
  if(e.notes&&e.notes.length)h+=`<section><div class="sec-h"><h2>À propos de cette édition</h2></div><div class="list">${e.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}</div></section>`;
 }else{const c=CAT[S.cat];const l=arts.filter(a=>a.cat===S.cat);
  h+=`<section><div class="sec-h"><h2>${esc(c.label)}</h2><span>${l.length} news</span></div>${S.cat==="bourse"?'<div class="disclaim">Infos de marché, pas un conseil en investissement.</div>':""}<div class="list">${l.map(a=>card(a,a.importance==="une")).join("")}</div>${(e.catNotes&&e.catNotes[S.cat])?`<div class="note" style="margin-top:10px">${esc(e.catNotes[S.cat])}</div>`:""}</section>`}
 return h}

function renderAlerts(){const al=visibleAlerts();
 return `<section><div class="sec-h"><h2>Toutes les échéances</h2><span>${al.length}</span></div><div class="list">${al.map(a=>{const c=CAT[a.cat]||CAT.all;const d=a._d;
  return `<div class="card"><div class="row"><span class="tag" style="--c:${c.c}">${esc(c.label)}</span><span class="pill ${d===0?"une":d<=7?"important":"savoir"}" style="font-family:var(--f-mono)">${d===0?"Aujourd'hui":d===1?"Demain":"J-"+d}</span></div><h3>${esc(a.title)}</h3><p style="-webkit-line-clamp:4">${esc(a.detail||"")}</p><div class="foot"><span>${esc(fmtDate(a.date))}</span>${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener" style="font-weight:600;color:var(--accent)">${esc(a.source||host(a.url))} ↗</a>`:""}<button class="icsbtn" data-ics="${esc(a.title)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>Agenda</button></div></div>`}).join("")||'<div class="note">Aucune échéance à venir dans cette édition.</div>'}</div></section>`}

function renderSaved(){const items=Object.values(S.saved).sort((a,b)=>(b._at||0)-(a._at||0));
 if(!items.length)return `<div class="empty"><div class="sun" style="margin:0 auto"><i></i></div><h3>Pas encore de favoris</h3><p>Touche le marque-page d'une news pour la garder ici, même après l'édition suivante.</p></div>`;
 return `<section><div class="sec-h"><h2>Mes favoris</h2><span>${items.length}</span></div><div class="list">${items.map(a=>{const c=CAT[a.cat]||CAT.all;return `<a class="card" href="${esc(a.url)}" target="_blank" rel="noopener" style="text-decoration:none"><div class="row"><span class="tag" style="--c:${c.c}">${esc(c.label)}</span><span class="eyebrow">${esc(a._date?fmtDate(a._date,{day:"numeric",month:"short"}):"")}</span></div><h3>${esc(a.title)}</h3><p>${esc(a.summary)}</p><div class="foot"><span class="src">${esc(initials(a.source))}</span>${esc(a.source)}<span style="margin-left:auto;color:var(--accent);font-weight:600">Lire ↗</span></div></a>`}).join("")}</div></section>`}

function renderArchive(){return `<section><div class="sec-h"><h2>Éditions</h2><span>${S.editions.length} dispo</span></div><p style="margin:0 0 12px;color:var(--ink-2);font-size:14px">Une nouvelle édition arrive chaque nuit vers 2h. Choisis une date pour relire un brief.</p><div class="archive">${S.editions.map(d=>`<button data-ed="${esc(d)}" aria-pressed="${S.cur&&S.cur.date===d}">${esc(fmtDate(d,{weekday:"short",day:"numeric",month:"short"}))}</button>`).join("")}</div></section>`}

function render(){
 document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.view===S.view?"page":"false"));
 const m=$("#main");
 if(S.loading){m.innerHTML='<div class="skel" style="height:260px;border-radius:24px"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';$("#chips").innerHTML="";return}
 if(!S.cur){m.innerHTML=`<div class="empty"><div class="sun" style="margin:0 auto"><i></i></div><h3>${S.dbOk?"Le premier brief arrive":"Brief indisponible ici"}</h3><p>${S.dbOk?"Chaque nuit vers 2h, une nouvelle édition est préparée et apparaît ici automatiquement.":"Vérifie ta connexion internet, puis touche le bouton Actualiser."}</p></div>`;$("#chips").innerHTML="";return}
 $("#dateLabel").textContent=fmtDate(S.cur.date)+(S.cur.date===todayISO()?" · aujourd'hui":"");
 const al=visibleAlerts().filter(a=>a._d<=3).length;const b=$("#alertBadge");b.hidden=!al;b.textContent=al;
 $("#chips").parentElement.querySelector(".chips").style.display=S.view==="home"?"":"none";
 $(".search").style.display=S.view==="home"?"":"none";
 renderChips();
 m.innerHTML=S.view==="home"?renderHome():S.view==="listen"?renderListen():S.view==="alerts"?renderAlerts():S.view==="saved"?renderSaved():renderArchive();
 if(S.view==="listen")syncPlayer();renderMini();
}

function openSheet(k){const a=allArticles().find(x=>keyOf(x)===k);if(!a)return;markRead(k);document.querySelectorAll(`[data-open="${CSS.escape(k)}"]`).forEach(n=>n.classList.add("read"));const c=CAT[a.cat]||CAT.all;const sv=!!S.saved[k];

 const sc=$("#pScrub");sc.addEventListener("input",()=>{sc.dragging=true;$("#pT").textContent=fmtT(+sc.value)});sc.addEventListener("change",()=>{sc.dragging=false;seekTo(+sc.value)});
 $("#pRate").onclick=()=>{const R=[1,1.15,1.3,1.5,0.9];P.rate=R[(R.indexOf(P.rate)+1)%R.length];AU.playbackRate=P.rate;lsSet("aube_rate",P.rate);$("#pRate").textContent="Vitesse ×"+String(P.rate).replace(".",",")};
 $("#pSleep").onclick=()=>{const O=[0,10,20,30];const cur=P.sleepMin||0;P.sleepMin=O[(O.indexOf(cur)+1)%O.length];clearTimeout(P.sleepT);if(P.sleepMin){P.sleepAt=Date.now()+P.sleepMin*60000;P.sleepT=setTimeout(()=>{AU.pause();P.sleepAt=0;P.sleepMin=0;toast("Minuteur terminé")},P.sleepMin*60000);toast("Arrêt dans "+P.sleepMin+" min")}else{P.sleepAt=0;toast("Minuteur désactivé")}$("#pSleep").textContent=P.sleepMin?"Arrêt dans "+P.sleepMin+" min":"Minuteur"};
 document.querySelectorAll("[data-chap]").forEach(b=>b.onclick=()=>{seekTo(chapters()[+b.dataset.chap].t+0.01);if(AU.paused)playPause()});
 offlineStatus()}
async function offlineStatus(){const o=$("#offl");if(!o||!S.cur.podcast)return;if(!("caches" in window)){o.textContent="";return}
 const c=await caches.open("aube-audio");const hit=await c.match(absURL(S.cur.podcast.src));
 if(hit)o.innerHTML=`<span class="ok">✓ Disponible hors connexion</span><span>${(S.cur.podcast.duration/60).toFixed(0)} min</span>`;
 else{o.innerHTML=`<button class="pchip" style="background:var(--accent);color:var(--accent-ink)" id="dlBtn">${IC.dl}Télécharger pour le métro</button>`;$("#dlBtn").onclick=async()=>{o.textContent="Téléchargement…";await cacheAudio(true);offlineStatus()}}}
async function cacheAudio(force){try{const e=S.cur;if(!e||!e.podcast||!("caches" in window))return;if(!force&&navigator.connection&&navigator.connection.saveData)return;
 const c=await caches.open("aube-audio");const u=absURL(e.podcast.src);if(await c.match(u))return;const r=await fetch(u,{cache:"no-store"});if(!r.ok)return;await c.put(u,r);
 const keys=await c.keys();const keep=keys.map(k=>k.url).sort().reverse().slice(0,3);for(const k of keys)if(!keep.includes(k.url))await c.delete(k)}catch(x){if(force)toast("Téléchargement impossible : vérifie ta connexion")}}
function renderMini(){const mi=$("#mini");const show=P.src&&S.view!=="listen"&&(!AU.paused||AU.currentTime>0)&&!AU.ended;
 mi.hidden=!show;$(".app").classList.toggle("withmini",!!show);if(!show)return;const c=chapters()[curChap(AU.currentTime)];
 mi.innerHTML=`<div><div class="mt" data-view="listen" role="button"><b id="miniChap">${esc(c?c.title:"Le brief audio")}</b><span>Aube · ${esc(fmtDate(P.ed.date,{day:"numeric",month:"short"}))}</span></div><button class="mp" data-pp aria-label="Lecture ou pause">${AU.paused?IC.play:IC.pause}</button><i class="mbar" id="miniBar" style="width:${dur()?AU.currentTime/dur()*100:0}%"></i></div>`;
 mi.querySelector(".mp").onclick=e=>{e.stopPropagation();playPause()}}

/* voix du téléphone (secours, quand une édition n'a pas de podcast) */
function ttsToggle(){if(!("speechSynthesis" in window)){toast("Ton téléphone ne propose pas de voix de lecture");return}
 if(speechSynthesis.speaking){speechSynthesis.cancel();render();return}
 const e=S.cur;const parts=[`Brief du ${fmtDate(e.date)}.`,...(e.thirty||[])];CATS.filter(c=>c.id!=="all"&&!S.hidden.includes(c.id)).forEach(c=>{const l=allArticles().filter(a=>a.cat===c.id);if(l.length){parts.push(c.label+".");l.forEach(a=>parts.push(a.title+". "+a.summary))}});
 const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));parts.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(v)u.voice=v;u.rate=P.rate;if(i===parts.length-1)u.onend=()=>render();speechSynthesis.speak(u)});render()}

/* ---------- réglages ---------- */
function openSettings(){$("#sheet").innerHTML=`<div class="grab"></div><button class="sclose" data-close="1" aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="set"><h2 id="sTitle" style="margin-top:4px">Réglages</h2>
 <h3>Mes catégories</h3><div class="togs">${CATS.filter(c=>!["all","une"].includes(c.id)).map(c=>`<button class="tog" data-tog="${c.id}" aria-pressed="${!S.hidden.includes(c.id)}" style="--c:${c.c}"><span class="dot"></span>${esc(c.label)}</button>`).join("")}</div>
 <p class="sethint">Touche une catégorie pour la masquer ou l'afficher. « À la une » reste toujours visible.</p>
 <h3>Taille du texte</h3><div class="seg">${[[1,"Normal"],[1.1,"Grand"],[1.2,"Très grand"]].map(([z,l])=>`<button data-zoom="${z}" aria-pressed="${S.zoom===z}">${l}</button>`).join("")}</div>
 <h3>Ville pour la météo</h3><form class="cityrow" id="cityForm"><input id="cityIn" value="${esc(S.city.name)}" placeholder="Ex. Lyon" autocomplete="off"><button type="submit">OK</button></form><p class="sethint" id="cityMsg">Météo du jour affichée en haut du brief.</p>
 <h3>Lecture</h3><button class="ghost" id="resetRead" style="width:100%">Marquer tout comme non lu</button>
 <p class="sethint" style="margin-top:16px">Aube · nouvelle édition chaque nuit vers 2h. Tes favoris, réglages et news lues restent sur ce téléphone.</p></div>`;
 $("#scrim").classList.add("on");$("#sheet").classList.add("on");
 $("#resetRead").onclick=()=>{S.read={};lsSet("aube_read",S.read);toast("Toutes les news sont non lues");render()};
 $("#cityForm").onsubmit=async e=>{e.preventDefault();const q=$("#cityIn").value.trim();if(!q)return;$("#cityMsg").textContent="Recherche…";
  try{const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=fr&country=FR&name="+encodeURIComponent(q));const j=await r.json();const g=j.results&&j.results[0];
   if(!g){$("#cityMsg").textContent="Ville introuvable. Vérifie l'orthographe.";return}
   S.city={name:g.name,lat:g.latitude,lon:g.longitude};lsSet("aube_city",S.city);S.wx=null;$("#cityMsg").textContent="Météo réglée sur "+g.name+(g.admin2?" ("+g.admin2+")":"")+".";await loadWx();render()}
  catch(x){$("#cityMsg").textContent="Pas de connexion. Réessaie plus tard."}}}
$("#setBtn").onclick=openSettings;

/* ---------- tirer pour actualiser ---------- */
(()=>{let y0=null,dy=0;const P=$("#ptr");
 addEventListener("touchstart",e=>{if(scrollY<=0&&$("#flash").hidden&&!$("#sheet").classList.contains("on"))y0=e.touches[0].clientY;else y0=null},{passive:true});
 addEventListener("touchmove",e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);P.style.transform=`translateY(${Math.min(dy*.5,70)-70}px) rotate(${dy*2}deg)`},{passive:true});
 addEventListener("touchend",async()=>{if(y0===null)return;y0=null;if(dy>120){P.classList.add("go");P.style.transform="translateY(0)";vib(10);await boot(true);loadWx()}P.classList.remove("go");P.style.transform="";dy=0});})();

render();
const CACHE_ED={};
async function getJSON(u,fresh){const r=await fetch(u+(fresh?"?t="+Date.now():""),{cache:fresh?"no-store":"default"});if(!r.ok)throw new Error(r.status);return r.json()}
async function loadEdition(d){if(CACHE_ED[d])return CACHE_ED[d];try{const e=await getJSON("editions/"+d+".json");CACHE_ED[d]=e;return e}catch(x){return null}}
async function boot(fresh,silent){
 const rb=$("#refreshBtn");rb.classList.add("spin");
 try{const idx=await getJSON("editions/index.json",fresh);S.editions=(idx.dates||[]).slice().sort().reverse();
  const want=S.cur&&S.cur.date!==idx.latest&&S.editions.includes(S.cur.date)&&!fresh?S.cur.date:idx.latest;
  const prevLatest=S.cur&&S.cur.date;
  delete CACHE_ED[idx.latest];
  const e=await loadEdition(want);if(e)S.cur=e;S.dbOk=true;$("#offline").hidden=navigator.onLine;
  if(fresh&&prevLatest&&prevLatest!==idx.latest)toast("Nouvelle édition chargée");else if(fresh&&!silent)toast("Brief à jour");
 }catch(x){S.dbOk=!!S.cur;$("#offline").hidden=false}
 S.loading=false;rb.classList.remove("spin");render();
}
$("#refreshBtn").onclick=()=>{boot(true);loadWx()};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&(!S.cur||S.cur.date===S.editions[0]))boot(true,true)});
addEventListener("online",()=>{$("#offline").hidden=true;boot(true,true)});addEventListener("offline",()=>{$("#offline").hidden=false});
let deferred=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;$("#installBtn").hidden=false});
$("#installBtn").onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;$("#installBtn").hidden=true};
addEventListener("appinstalled",()=>{$("#installBtn").hidden=true;toast("Aube est installée")});
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(location.hash==="#alertes")S.view="alerts";if(location.hash==="#ecouter")S.view="listen";
boot(false).then(()=>{cacheAudio(false)});loadWx();
</script>
